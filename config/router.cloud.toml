[router]
backoff_base_seconds = 0.25
backoff_max_seconds = 2.0
health_failure_threshold = 3
health_cooldown_seconds = 30.0

# Vercel injects VERCEL_OIDC_TOKEN into deployments. No provider credential is
# stored in source control. Separate provider IDs keep model-level failover in
# our router even though both adapters use Vercel's OpenAI-compatible gateway.
[[providers]]
id = "vercel_gateway_google"
adapter = "openai_compatible"
base_url = "https://ai-gateway.vercel.sh/v1"
api_key_env = "AI_GATEWAY_API_KEY"
api_key_fallback_envs = ["VERCEL_OIDC_TOKEN"]
enabled = true
timeout_seconds = 50.0

[[providers]]
id = "vercel_gateway_openai"
adapter = "openai_compatible"
base_url = "https://ai-gateway.vercel.sh/v1"
api_key_env = "AI_GATEWAY_API_KEY"
api_key_fallback_envs = ["VERCEL_OIDC_TOKEN"]
enabled = true
timeout_seconds = 50.0

[[models]]
id = "cloud-gpt-nano"
provider_id = "vercel_gateway_openai"
upstream_model = "openai/gpt-5.4-nano"
capabilities = ["code_analysis", "refactoring", "test_generation", "architecture", "debugging"]
cost_tier = "cheap"
priority = 10
approved_for_proprietary = false
requests_per_minute = 10
requests_per_day = 200
tokens_per_minute = 50000
tokens_per_day = 200000
daily_cost_limit_usd = 0.10
input_cost_per_million = 0.20
output_cost_per_million = 1.25
max_retries = 1
timeout_seconds = 50.0

[[models]]
id = "cloud-gemini-flash-fallback"
provider_id = "vercel_gateway_google"
upstream_model = "google/gemini-3-flash"
capabilities = ["code_analysis", "refactoring", "test_generation", "architecture", "debugging"]
cost_tier = "cheap"
priority = 20
approved_for_proprietary = false
requests_per_minute = 10
requests_per_day = 100
tokens_per_minute = 30000
tokens_per_day = 100000
daily_cost_limit_usd = 0.15
input_cost_per_million = 0.50
output_cost_per_million = 3.00
max_retries = 1
timeout_seconds = 50.0
